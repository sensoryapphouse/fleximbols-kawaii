<!-- MY TURN = the turn passes to ME: a greyed other person hands off, I point to myself -->
<!-- greyed second person (the previous turn-taker) at upper-right -->
<g stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<path d="M 430 196 L 470 196 L 462 256 L 438 256 Z" fill="url(#s3d_9aa7b3)" data-flat="#9aa7b3"/>
