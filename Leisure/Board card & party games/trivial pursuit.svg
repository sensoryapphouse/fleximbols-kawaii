  <path d="M 145 120 L 224.7 74 A 92 92 0 0 1 224.7 166 Z" fill="url(#s3d_f266aa)" data-flat="#f266aa" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
