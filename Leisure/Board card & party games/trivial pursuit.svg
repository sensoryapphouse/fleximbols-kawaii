  <!-- wedge 4 (lower left): purple -->
  <path d="M 145 120 L 145 212 A 92 92 0 0 1 65.3 166 Z" fill="url(#s3d_7c3fac)" data-flat="#7c3fac" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>
