<svg xmlns="http://www.w3.org/2000/svg" viewBox="79.52 130.72 352.97 352.97"><defs><radialGradient id="s3d_b9bdc2" cx="0.35" cy="0.28" r="0.9"><stop offset="0" stop-color="#ced1d4"/><stop offset="0.45" stop-color="#b9bdc2"/><stop offset="1" stop-color="#94979b"/></radialGradient><radialGradient id="s3d_b5651d" cx="0.35" cy="0.28" r="0.9"><stop offset="0" stop-color="#cb9361"/><stop offset="0.45" stop-color="#b5651d"/><stop offset="1" stop-color="#915117"/></radialGradient><radialGradient id="s3d_8a5a2b" cx="0.35" cy="0.28" r="0.9"><stop offset="0" stop-color="#ad8c6b"/><stop offset="0.45" stop-color="#8a5a2b"/><stop offset="1" stop-color="#6e4822"/></radialGradient><radialGradient id="s3d_f5d6b0" cx="0.35" cy="0.28" r="0.9"><stop offset="0" stop-color="#f8e2c8"/><stop offset="0.45" stop-color="#f5d6b0"/><stop offset="1" stop-color="#c4ab8d"/></radialGradient></defs><g>
