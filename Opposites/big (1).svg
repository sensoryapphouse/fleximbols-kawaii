  <!-- "big": a large kawaii blob character beside a small one (size contrast),
       with size-arrows around the big one. Text-free. -->

  <!-- ground line -->
  <line x1="70" y1="430" x2="442" y2="430" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" opacity="0.35" />

  <!-- BIG character -->
  <g stroke="#1a1a1a" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="196" cy="270" rx="130" ry="150" fill="#7ec8f0" stroke-width="8" />
    <!-- arms -->
    <path d="M74 280 q-34 6 -40 36" fill="none" stroke-width="8" />
    <path d="M318 280 q34 6 40 36" fill="none" stroke-width="8" />
  </g>
  <!-- big face -->
  <g stroke="#1a1a1a" stroke-linecap="round">
    <circle cx="156" cy="250" r="13" fill="#1f1f1f" />
    <circle cx="236" cy="250" r="13" fill="#1f1f1f" />
    <path d="M170 296 Q196 326 222 296" fill="none" stroke-width="9" />
    <ellipse cx="126" cy="294" rx="22" ry="14" fill="#ff9bb5" opacity="0.7" stroke="none" />
    <ellipse cx="266" cy="294" rx="22" ry="14" fill="#ff9bb5" opacity="0.7" stroke="none" />
  </g>

  <!-- small character -->
  <g stroke="#1a1a1a" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="392" cy="372" rx="48" ry="56" fill="#7ec8f0" stroke-width="6" />
  </g>
  <g stroke="#1a1a1a" stroke-linecap="round">
    <circle cx="378" cy="364" r="5.5" fill="#1f1f1f" />
    <circle cx="406" cy="364" r="5.5" fill="#1f1f1f" />
    <path d="M381 380 Q392 390 403 380" fill="none" stroke-width="4" />
    <ellipse cx="366" cy="380" rx="8" ry="5" fill="#ff9bb5" opacity="0.7" stroke="none" />
    <ellipse cx="418" cy="380" rx="8" ry="5" fill="#ff9bb5" opacity="0.7" stroke="none" />
  </g>

  <!-- up/down size arrow on the big character (height emphasis) -->
  <g stroke="#e0688a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="40" y1="128" x2="40" y2="416" />
    <polyline points="24,150 40,118 56,150" fill="#e0688a" />
    <polyline points="24,394 40,426 56,394" fill="#e0688a" />
  </g>
</svg>
