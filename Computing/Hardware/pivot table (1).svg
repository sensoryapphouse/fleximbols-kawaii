  <!-- Pivot table: grid with darker header, grouped rows, total bar, rotation arrow -->

  <!-- Table outer frame (slightly smaller to leave room for arrow) -->
  <rect x="22" y="28" width="216" height="175" fill="#ffffff" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Header row -->
  <rect x="22" y="28" width="216" height="30" fill="url(#s3d_4d4d4d)" data-flat="#4d4d4d" stroke="#1a1a1a" stroke-width="5.55" stroke-linejoin="round"/>
  <!-- Row header column -->
  <rect x="22" y="28" width="54" height="175" fill="url(#s3d_7f7f7f)" data-flat="#7f7f7f" stroke="#1a1a1a" stroke-width="4.45" stroke-linejoin="round"/>

  <!-- Column dividers -->
  <line x1="76" y1="28" x2="76" y2="203" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="130" y1="28" x2="130" y2="203" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="184" y1="28" x2="184" y2="203" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Row dividers -->
  <line x1="22" y1="58" x2="238" y2="58" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="22" y1="88" x2="238" y2="88" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="22" y1="118" x2="238" y2="118" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="22" y1="148" x2="238" y2="148" stroke="#1a1a1a" stroke-width="4.45"/>
  <line x1="22" y1="178" x2="238" y2="178" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Grouped row highlight (rows 2–3 share a group colour) -->
  <rect x="23" y="59" width="52" height="59" fill="url(#s3d_90a7d6)" data-flat="#90a7d6"/>
  <!-- Total row highlight -->
  <rect x="23" y="179" width="214" height="23" fill="url(#s3d_f7de58)" data-flat="#f7de58"/>
  <!-- Small total bar inside last data cell (visual) -->
  <rect x="138" y="183" width="38" height="15" fill="#529929" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>
  <rect x="84" y="183" width="22" height="15" fill="#f8130d" stroke="#1a1a1a" stroke-width="3.33" stroke-linejoin="round"/>

  <!-- Rotation / fold arrow (top-right corner) -->
  <!-- Arrow arc: circular arrow suggesting rotation/pivot -->
  <path d="M252,45 A30,30 0 1,1 252,75" fill="none" stroke="#1a1a1a" stroke-width="5.55" stroke-linecap="round"/>
  <!-- Arrowhead pointing down-left at end of arc -->
  <polygon points="252,75 242,62 263,65" fill="#000000"/>
</g></svg>