  <defs>
    <linearGradient id="calcArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7bb0ff"/>
      <stop offset="100%" stop-color="#3a72d8"/>
    </linearGradient>
    <radialGradient id="calcbl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3a0b0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f3a0b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g stroke="#1a1a1a" stroke-linejoin="round" stroke-linecap="round">
    <!-- graph card -->
    <rect x="64" y="64" width="384" height="384" rx="30" fill="#fffdf7" stroke-width="9"/>
    <!-- axes -->
    <line x1="118" y1="120" x2="118" y2="392" stroke-width="9"/>
    <line x1="118" y1="392" x2="404" y2="392" stroke-width="9"/>
    <!-- shaded area under a curve = integral -->
    <path d="M118,392 L118,338 C190,300 250,250 300,180 C330,140 360,120 392,116 L392,392 Z"
          fill="url(#calcArea)" stroke="none" opacity="0.85"/>
    <!-- the curve itself -->
    <path d="M118,338 C190,300 250,250 300,180 C330,140 360,120 392,116"
          fill="none" stroke="#1b3f7a" stroke-width="11"/>
    <!-- vertical hatch lines under area -->
    <g stroke="#1b3f7a" stroke-width="4" opacity="0.5">
      <line x1="170" y1="392" x2="170" y2="318"/>
      <line x1="230" y1="392" x2="230" y2="264"/>
      <line x1="300" y1="392" x2="300" y2="180"/>
    </g>
    <!-- cute face on the area -->
    <ellipse cx="230" cy="372" rx="24" ry="13" fill="url(#calcbl)" stroke="none"/>
    <ellipse cx="318" cy="372" rx="24" ry="13" fill="url(#calcbl)" stroke="none"/>
    <circle cx="248" cy="356" r="8" fill="#1a1a1a"/>
    <circle cx="300" cy="356" r="8" fill="#1a1a1a"/>
    <path d="M258,372 Q274,384 290,372" fill="none" stroke="#1a1a1a" stroke-width="5"/>
  </g>
</svg>
