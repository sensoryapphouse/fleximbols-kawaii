></rdf:RDF></metadata><g data-fit="1" transform="translate(44.00 80.55) scale(1.4621)">
  <!-- Cream eyeshadow pot + finger applicator + creamy texture -->
  <!-- Cream pot (jar with screw lid removed, sitting open) -->
  <!-- Pot body (squat cylinder) -->
  <ellipse cx="100" cy="200" rx="70" ry="14" fill="url(#s3d_5e1f0a)" data-flat="#5e1f0a" stroke="#1a1a1a" stroke-width="7.40"/>
  <rect x="30" y="130" width="140" height="70" fill="url(#s3d_7c3fac)" data-flat="#7c3fac" stroke="#1a1a1a" stroke-width="7.40"/>
  <ellipse cx="100" cy="130" rx="70" ry="16" fill="url(#s3d_7c3fac)" data-flat="#7c3fac" stroke="#1a1a1a" stroke-width="7.40"/>
  <!-- Pot rim (inner) -->
  <ellipse cx="100" cy="130" rx="60" ry="12" fill="url(#s3d_392170)" data-flat="#392170" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Creamy product surface (glossy mauve cream) -->
  <ellipse cx="100" cy="132" rx="54" ry="10" fill="url(#s3d_f4a4b2)" data-flat="#f4a4b2" stroke="#1a1a1a" stroke-width="4.45"/>
  <!-- Cream dip/swirl (finger dipped in, dent in the cream) -->
  <ellipse cx="100" cy="132" rx="20" ry="5" fill="url(#s3d_f266aa)" data-flat="#f266aa" stroke="#1a1a1a" stroke-width="2.96"/>
  <!-- Cream shine highlight (cream has soft sheen) -->
  <ellipse cx="78" cy="128" rx="14" ry="3" fill="#ffffff" stroke="none"/>
  <!-- Pot label band -->
  <rect x="30" y="168" width="140" height="20" fill="url(#s3d_dff3fd)" data-flat="#dff3fd" stroke="#1a1a1a" stroke-width="4.45"/>

  <!-- Finger applicator (hand pointing down at cream from top-right) -->
  <!-- Hand/forearm coming from top right -->
  <path d="M 220 30 Q 250 30 256 60 L 246 84 Q 232 86 220 78 Q 208 70 206 54 Q 206 38 220 30 Z" fill="url(#s3d_eed5b6)" data-flat="#eed5b6" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Index finger extended down-left toward cream -->
  <path d="M 210 78 Q 196 100 178 122 Q 174 132 184 134 Q 196 132 208 116 Q 222 96 230 80 Z" fill="url(#s3d_eed5b6)" data-flat="#eed5b6" stroke="#1a1a1a" stroke-width="7.40" stroke-linejoin="round"/>
  <!-- Fingernail -->
  <ellipse cx="182" cy="128" rx="4" ry="3" fill="#f4a4b2" stroke="#1a1a1a" stroke-width="2.96" transform="rotate(-40 182 128)"/>
  <!-- Cream dab on fingertip -->
  <circle cx="184" cy="132" r="6" fill="#f266aa" stroke="#1a1a1a" stroke-width="2.96"/>
