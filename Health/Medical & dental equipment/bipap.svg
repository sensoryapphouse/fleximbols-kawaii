<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata><defs><radialGradient id="ge6b98a" cx="40%" cy="32%" r="78%"><stop offset="0" stop-color="#eecead"/><stop offset="0.5" stop-color="#e6b98a"/><stop offset="1" stop-color="#d3832f"/></radialGradient><radialGradient id="g4d4d4d" cx="40%" cy="32%" r="78%"><stop offset="0" stop-color="#828282"/><stop offset="0.5" stop-color="#4d4d4d"/><stop offset="1" stop-color="#363636"/></radialGradient><radialGradient id="g1d0e82" cx="40%" cy="32%" r="78%"><stop offset="0" stop-color="#3319e5"/><stop offset="0.5" stop-color="#1d0e82"/><stop offset="1" stop-color="#140a5b"/></radialGradient><radialGradient id="gb8b8b8" cx="40%" cy="32%" r="78%"><stop offset="0" stop-color="#cdcdcd"/><stop offset="0.5" stop-color="#b8b8b8"/><stop offset="1" stop-color="#818181"/></radialGradient><radialGradient id="sheen" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs><g transform="translate(-10.69 23.11) scale(1.7915)" stroke-linejoin="round" stroke-linecap="round">
  <!-- Machine body (bedside box, slightly wider than CPAP) -->
  <rect x="20" y="75" width="155" height="108" rx="12" ry="12" fill="url(#ge6b98a)" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Front panel screen -->
  <rect x="32" y="90" width="72" height="48" rx="5" ry="5" fill="url(#g1d0e82)" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Screen shows two pressure wave arches to distinguish from CPAP -->
  <path d="M 38,114 Q 46,98 54,114 Q 62,130 70,114 Q 78,98 86,114" fill="none" stroke="#f7de58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dual-pressure dial (key BiPAP differentiator) -->
  <circle cx="138" cy="105" r="18" fill="#efefef" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="138" cy="105" r="5" fill="url(#g4d4d4d)" stroke="#000000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Dial tick marks -->
  <line x1="138" y1="88" x2="138" y2="93" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="155" y1="105" x2="150" y2="105" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="122" x2="138" y2="117" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="121" y1="105" x2="126" y2="105" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Dial pointer needle -->
  <line x1="138" y1="105" x2="148" y2="96" stroke="#f8130d" stroke-width="2" stroke-linecap="round"/>
  <!-- IPAP indicator: upward arrow (higher pressure) -->
  <line x1="116" y1="150" x2="116" y2="138" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <polyline points="112,142 116,138 120,142" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- EPAP indicator: downward arrow (lower pressure) -->
  <line x1="148" y1="138" x2="148" y2="150" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <polyline points="144,146 148,150 152,146" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hose port -->
  <rect x="172" y="120" width="18" height="22" rx="5" fill="url(#gb8b8b8)" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Flexible hose -->
  <path d="M 190,131 Q 214,131 222,142 Q 230,154 244,154" fill="none" stroke="#7f7f7f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Full-face mask (larger than CPAP nasal, covering nose+mouth area) -->
  <path d="M 244,136 Q 260,124 276,138 Q 282,160 262,174 Q 250,178 244,170 Z" fill="#dff3fd" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Mask strap -->
  <line x1="262" y1="124" x2="272" y2="112" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="262" y1="174" x2="272" y2="186" stroke="#b8b8b8" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="101.5" cy="102.2" rx="68.4" ry="23.2" fill="url(#sheen)"/></g></svg>
