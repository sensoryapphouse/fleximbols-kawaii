<line x1="250" y1="322" x2="262" y2="322" stroke="#9aa7b1" stroke-width="4" stroke-linecap="round"/>
<line x1="250" y1="344" x2="262" y2="344" stroke="#9aa7b1" stroke-width="4" stroke-linecap="round"/>
<!-- short neck -->
