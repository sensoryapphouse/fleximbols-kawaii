<svg xmlns="http://www.w3.org/2000/svg" viewBox="86.26 64.93 368.48 368.48"><defs><radialGradient id="s3d_cdd3da" cx="0.35" cy="0.28" r="0.9"><stop offset="0" stop-color="#dce0e5"/><stop offset="0.45" stop-color="#cdd3da"/><stop offset="1" stop-color="#a4a9ae"/></radialGradient><radialGradient id="s3d_bfe3f7" cx="0.35" cy="0.28" r="0.9"><stop offset="0" stop-color="#d2ebf9"/><stop offset="0.45" stop-color="#bfe3f7"/><stop offset="1" stop-color="#99b6c6"/></radialGradient></defs><g transform="rotate(25 256 256)">
