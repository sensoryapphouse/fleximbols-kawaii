<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <linearGradient id="redfld" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8362f" />
      <stop offset="100%" stop-color="#c41812" />
    </linearGradient>
  </defs>

  <!-- pole -->
  <rect x="78" y="70" width="10" height="380" rx="5" fill="#8a6a3a" stroke="#1a1a1a" stroke-width="4" />
  <circle cx="83" cy="68" r="10" fill="#d8b25a" stroke="#1a1a1a" stroke-width="4" />

  <!-- red field -->
  <rect x="88" y="96" width="336" height="224" rx="10" fill="url(#redfld)" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round" />

  <!-- canton: white saltire of four triangles forming a diamond/square in upper-hoist -->
  <g transform="translate(168,168)">
    <!-- white square backing rotated 45 -->
    <rect x="-44" y="-44" width="88" height="88" fill="#ffffff" stroke="#1a1a1a" stroke-width="4" transform="rotate(45)" />
    <!-- red center to give the saltire/cross look -->
    <rect x="-22" y="-22" width="44" height="44" fill="url(#redfld)" transform="rotate(45)" />
    <!-- the white forms a hollow diamond = four corner triangles (saltire) -->
  </g>

  <!-- small French tricolour in extreme top-left of the field -->
  <g stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round">
    <rect x="104" y="112" width="20" height="44" fill="#0055a4" />
    <rect x="124" y="112" width="20" height="44" fill="#ffffff" />
    <rect x="144" y="112" width="20" height="44" fill="#ef4135" />
    <rect x="104" y="112" width="60" height="44" fill="none" />
  </g>
</svg>
