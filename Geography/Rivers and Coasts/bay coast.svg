  <rect x="257" y="120" width="6" height="12" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.56"/>
  <circle cx="255" cy="180" r="14" fill="#137827" stroke="#1a1a1a" stroke-width="4.45"/>
  <rect x="252" y="190" width="6" height="12" fill="#5e1f0a" stroke="#1a1a1a" stroke-width="3.56"/>

