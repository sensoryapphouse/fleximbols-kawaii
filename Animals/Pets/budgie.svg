  <ellipse cx="145" cy="110" rx="30" ry="28" fill="url(#gf2e40d)" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Blue/green cheek patch -->
  <ellipse cx="126" cy="120" rx="11" ry="9" fill="url(#g3aa6a0)" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="164" cy="120" rx="11" ry="9" fill="url(#g3aa6a0)" stroke="#000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
