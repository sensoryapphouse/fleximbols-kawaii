  <!-- Body — slim, elongated -->
  <path d="M 112,148 Q 110,168 114,188 Q 124,200 145,202 Q 166,200 176,188 Q 180,168 178,148 Q 165,132 145,130 Q 125,132 112,148 Z" fill="url(#gf2e40d)" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
