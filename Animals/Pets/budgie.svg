  <path d="M 115,158 Q 145,150 175,158" fill="none" stroke="#529929" stroke-width="3" stroke-linecap="round"/>
  <path d="M 113,168 Q 145,160 177,168" fill="none" stroke="#529929" stroke-width="3" stroke-linecap="round"/>
  <path d="M 113,178 Q 145,170 177,178" fill="none" stroke="#529929" stroke-width="3" stroke-linecap="round"/>
  <!-- Wing panel green -->
