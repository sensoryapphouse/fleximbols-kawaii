  <path d="M 120,208 L 115,214 M 124,209 L 122,216 M 128,209 L 128,216 M 132,208 L 134,215" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 150,208 L 145,214 M 154,209 L 152,216 M 158,209 L 158,216 M 162,208 L 164,215" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
