<svg xmlns="http://www.w3.org/2000/svg" viewBox="93.40 93.40 349.09 349.09"><defs><radialGradient id="s3d_5aa83c" cx="0.35" cy="0.28" r="0.9"><stop offset="0" stop-color="#8cc276"/><stop offset="0.45" stop-color="#5aa83c"/><stop offset="1" stop-color="#488630"/></radialGradient><radialGradient id="s3d_8fce6e" cx="0.35" cy="0.28" r="0.9"><stop offset="0" stop-color="#b1dd9a"/><stop offset="0.45" stop-color="#8fce6e"/><stop offset="1" stop-color="#72a558"/></radialGradient></defs>
